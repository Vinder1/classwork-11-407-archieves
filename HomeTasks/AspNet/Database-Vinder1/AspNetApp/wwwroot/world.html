<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визуализация спиральной галактики</title>
    <link rel="stylesheet" href="galaxy_map.css" />
</head>
<body>
    <h1>🌌 Спиральная галактика</h1>
    
    <div id="canvas-container" style="position: relative;">
        <div id="loading" class="loading" style="display: none;">Загрузка данных...</div>
        <div id="error" class="error" style="display: none;"></div>
        <canvas id="galaxyCanvas" width="800" height="800"></canvas>
    </div>
    
    <div class="stats-panel">
        <div class="stat-item" id="starCount">Звезд: 0</div>
        <div class="stat-item" id="radiusRange">Радиус: 0 - 0</div>
    </div>
    
    <div class="controls">
        <button id="toggle-animation">⏯ Анимация</button>
        <button id="reset-view">↺ Сброс вида</button>
        <button id="reload-data">🔄 Обновить данные</button>
        
        <div class="slider-container">
            <span>✨ Яркость:</span>
            <input type="range" id="brightness" min="0.2" max="1" step="0.1" value="0.8">
        </div>
        
        <div class="slider-container">
            <span>🔍 Масштаб:</span>
            <input type="range" id="scale" min="10" max="40" step="1" value="25">
        </div>
        
        <div class="slider-container">
            <span>🌀 Спиральность:</span>
            <input type="range" id="spiral" min="0" max="2" step="0.1" value="1">
        </div>
    </div>
</body>
<script src="galaxy_map.js"></script>
</html>
