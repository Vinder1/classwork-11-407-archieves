<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <base href="http://localhost:5000/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <title>Профиль</title>
</head>

<body>
    <nav class="left-links">
        <!-- js-generated links -->
        <script type="module" src="js/navbar.js"></script>
    </nav>

    <div class="dialog-window">
        <div class="dialog-box">
            <h3> Профиль </h3>
            <form class="vertical-box" action="signin" method="post" id="sign-in">
                <label class="box-item" for="input-login">Логин</label>
                <input class="box-item" id="input-login" type="text" name="login" readonly />

                <label class="box-item" for="input-name">Новое имя</label>
                <input class="box-item" id="input-name" type="text" name="name" />

                <label class="box-item" for="input-password" id="password-label">Новый пароль</label>
                <input class="box-item" id="input-password" type="password" name="password" />

                <label class="box-item" for="input-email">Почта</label>
                <input class="box-item" id="input-email" type="text" name="email" />

                <label class="box-item" for="input-birthday">День рождения</label>
                <input class="box-item" id="input-birthday" type="date" name="birthday" />

                <p class="box-item">
                    Баланс: <span id="user-balance"></span> монет
                </p>

                <input class="box-item btn" type="submit" value="Отправить данные" id="action-btn" />
                <input class="box-item" type="submit" value="Снести акк" style="color: red" id="delete-acc" />
            </form>
        </div>
    </div>
</body>
<script type="module" src="js/profile.js"></script>

</html>
