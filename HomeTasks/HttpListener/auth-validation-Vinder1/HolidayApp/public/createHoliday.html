<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <base href="http://localhost:5000/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <title>Регистрация</title>
</head>

<body>
    <nav class="left-links">
        <!-- js-generated links -->
        <script type="module" src="js/navbar.js"></script>
    </nav>

    <div class="dialog-window">
        <div class="dialog-box">
            <h3> Новый праздник </h3>
            <form class="vertical-box" action="signup" method="post" id="sign-up">
                <label class="box-item" for="input-name"> Название </label>
                <input class="box-item" id="input-name" type="text" name="login" required/>

                <label class="box-item" for="input-date"> Дата </label>
                <input class="box-item" id="input-date" type="date" required/>

                <input class="box-item btn" type="submit" value="Создать" />
            </form>
        </div>
    </div>
</body>
<script type="module" src="js/createHoliday.js"></script>

</html>
