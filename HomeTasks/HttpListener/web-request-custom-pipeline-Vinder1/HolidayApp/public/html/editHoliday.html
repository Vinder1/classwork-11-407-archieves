<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <base href="http://localhost:5000/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="holiday.css" />
    <title>Регистрация</title>
</head>

<body>
    <nav class="left-links">
        <a href="home" aria-label="К главной странице" class="scale-on-hover">
            <img src="image/home.png" alt="К главной странице" class="corner-icon">
        </a>
        <a href="contact" aria-label="Контакты" class="scale-on-hover">
            <img src="image/contact.png" alt="Контакты" class="corner-icon">
        </a>
        <a href="about" aria-label="О проекте" class="scale-on-hover">
            <img src="image/help.png" alt="О проекте" class="corner-icon">
        </a>
        <a href="signup" aria-label="Зарегистрироваться" id="signup-ref" class="scale-on-hover">
            <img src="image/signup.png" alt="Зарегистрироваться" class="corner-icon">
        </a>
        <a href="profile" aria-label="Профиль" id="profile-ref" class="scale-on-hover">
            <img src="image/profile.png"
                alt="Профиль" class="corner-icon"></a>
        <a href="holidays" aria-label="Мои праздники" id="holidays-ref" class="scale-on-hover">
            <img src="image/post.png" alt="Мои праздники"
                class="corner-icon">
        </a>
        <a href="presents" aria-label="Мои подарки" id="presents-ref" class="scale-on-hover">
            <img src="image/present.png" alt="Мои подарки" class="corner-icon">
        </a>
    </nav>

    <div class="dialog-window">
        <div class="dialog-box fade-in-fast">
            <h3> Изменить праздник </h3>
            <form class="vertical-box" action="signup" method="post" id="sign-up">
                <label class="box-item" for="input-name"> Название </label>
                <input class="box-item" id="input-name" type="text" name="login" required/>

                <label class="box-item" for="input-date"> Дата </label>
                <input class="box-item" id="input-date" type="date" required/>

                <input class="box-item green-button" type="submit" value="Изменить" id="update" />
                <button class="box-item green-button" style="background-color: red" id="delete">
                    Снести праздник
                </button>
            </form>
        </div>
    </div>
</body>
<script type="module" src="js/editHoliday.js"></script>

</html>
