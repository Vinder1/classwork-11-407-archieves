<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <base href="http://localhost:5000/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="holiday.css" />
    <title>Вход</title>
</head>

<body>
    <nav class="left-links">
        <!-- js-generated links -->
        <script type="module" src="js/navbar.js"></script>
    </nav>

    <div class="dialog-window">
        <div class="dialog-box fade-in-fast">
            <h3> Вход </h3>
            <form class="vertical-box" action="signin" method="post" id="sign-in">
                <label class="box-item" for="input-login">Логин</label>
                <input class="box-item" id="input-login" type="text" name="login" />
                
                <label class="box-item" for="input-password" id="password-label">Пароль</label>
                <input class="box-item" id="input-password" type="password" name="password" />
                
                <input class="box-item green-button" type="submit" value="Войти" id="action-btn" />
            </form>
        </div>
    </div>
</body>
<script type="module" src="js/signin.js"></script>

</html>
